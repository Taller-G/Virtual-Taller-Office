<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="theme-color" content="#12161f" />
    <meta name="description" content="Taller's 2D virtual office" />
    <link rel="icon" href="data:," />
    <title>Taller Office</title>
    <link rel="stylesheet" href="/src/style.css" />
  </head>
  <body>
    <header id="hud" class="hud" data-status="connecting">
      <span class="hud__dot" aria-hidden="true"></span>
      <span id="hud-status" class="hud__status">Connecting...</span>
      <span id="hud-world" class="hud__world" hidden></span>
      <span id="hud-players" class="hud__players"></span>
    </header>

    <div class="layout">
      <main id="game" class="game">
        <div id="toasts" class="toasts" aria-live="polite"></div>
      </main>

      <aside id="presence" class="presence" data-state="out" aria-label="Who is in the office">
        <h2 class="presence__title">
          In the office <span id="presence-count" class="presence__count"></span>
        </h2>
        <ul id="presence-list" class="presence__list"></ul>

        <section id="bubble" class="bubble" data-state="none" aria-label="Your conversation">
          <h3 id="bubble-title" class="bubble__title">In conversation</h3>
          <ul id="bubble-list" class="bubble__list"></ul>
          <p id="bubble-hint" class="bubble__hint"></p>
        </section>

        <section id="chat" class="chat" data-state="none" aria-label="Your bubble's conversation">
          <h3 class="chat__title">Conversation</h3>
          <ol id="chat-log" class="chat__log" aria-live="polite"></ol>
          <form id="chat-form" class="chat__form" autocomplete="off">
            <input
              id="chat-input"
              class="chat__input"
              type="text"
              spellcheck="false"
              placeholder="Nobody nearby"
              aria-label="Message for your bubble"
              disabled
            />
            <span id="chat-count" class="chat__count" aria-hidden="true"></span>
          </form>
          <p id="chat-hint" class="chat__hint" data-tone="info"></p>
        </section>
        <footer class="presence__me">
          <label class="presence__field">
            <span>Your name</span>
            <input id="my-name" type="text" autocomplete="off" spellcheck="false" />
          </label>
          <button id="away-toggle" type="button" class="button button--ghost" aria-pressed="false">
            Mark me away
          </button>
        </footer>
      </aside>
    </div>

    <div id="entry" class="entry" hidden>
      <form class="entry__card" autocomplete="off">
        <h1 class="entry__title">Taller Office</h1>
        <p class="entry__hint">Choose how everyone else will see you.</p>
        <label class="entry__field">
          <span>Your name</span>
          <input id="entry-name" type="text" required placeholder="Visible name" />
        </label>
        <div class="entry__agents">
          <span id="entry-agents-label" class="entry__agents-label">Agents</span>
          <p class="entry__agents-hint">Robots that walk with you.</p>
          <div class="stepper" role="group" aria-labelledby="entry-agents-label">
            <button
              id="entry-agents-less"
              type="button"
              class="stepper__button"
              aria-label="One agent fewer"
            >
              &minus;
            </button>
            <output
              id="entry-agents-value"
              class="stepper__value"
              for="entry-agents-less entry-agents-more"
              >0</output
            >
            <button
              id="entry-agents-more"
              type="button"
              class="stepper__button"
              aria-label="One agent more"
            >
              +
            </button>
          </div>
        </div>
        <div class="entry__avatars" role="group" aria-labelledby="entry-avatars-label">
          <span id="entry-avatars-label" class="entry__avatars-label">Your avatar</span>
          <div id="entry-avatars" class="avatar-grid"></div>
        </div>
        <button type="submit" class="button">Enter the office</button>
        <p class="entry__keys">You move with the arrow keys or with W A S D.</p>
      </form>
    </div>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
